# カレンダー名 ↔ ヨミ表名 の手動エイリアス
#
# 「カレンダーには本名で入っているが、ヨミ表ではハンドル/愛称で書かれている」
# のような表記体系の違いを救うためのマッピング。
#
# 運用: ダッシュボードの記入漏れ警告で「実はヨミ表にあるのに別表記で見つからない」
# ケースが見つかったら、ここに追加する。
#
# 書き方:
#   aliases:
#     - calendar: <カレンダーでの表記>
#       sheet: <ヨミ表での表記>
#
# 双方向で参照される（追加方向は気にしなくてよい）

aliases: []

# 例（実データから判明したケースを順次追加）:
# aliases:
#   - calendar: 大嶽恵理
#     sheet: megumi.k
#   - calendar: 瀧澤吉徳
#     sheet: 滝沢吉徳
